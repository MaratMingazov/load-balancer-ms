version: "3.9"

services:
  widgets-ms-red:
    image: maratmingazovr/widgets-ms:1.0
    container_name: widgets-ms-red
    ports:
      - "8090:8090"
    environment:
      MIRO_TOKEN: xxx
      DEFAULT_COLOR: RED
      SERVER_PORT: 8090

  widgets-ms-blue:
    image: maratmingazovr/widgets-ms:1.0
    container_name: widgets-ms-blue
    ports:
      - "8095:8095"
    environment:
      MIRO_TOKEN: xxx
      DEFAULT_COLOR: BLUE
      SERVER_PORT: 8095

  load-balancer:
    image: maratmingazovr/load-balancer-ms:1.0
    container_name: load-balancer-ms
    ports:
      - "8080:8080"
    depends_on:
      - widgets-ms-red
      - widgets-ms-blue

  kafka:
    image: confluentinc/cp-kafka:7.7.7
    container_name: kafka-ms
    ports:
      - "9092:9092"

    environment:
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"

      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      CLUSTER_ID: "kraft-cluster-1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CREATE_TOPICS: "widget-events:2:1"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8088:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092